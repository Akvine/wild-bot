###########################
#### Server properties ####
###########################
server.port=8080
server.servlet.context-path=/wild-bot

##########################
### Session properties ###
##########################
spring.session.cookie-name=SESSION
spring.session.jdbc.table-name=SPRING_SESSION
spring.session.store-type=jdbc
spring.session.jdbc.flush-mode=on_save
spring.servlet.multipart.max-file-size=5MB

###############################
### Telegram bot properties ###
###############################
telegram.bot.type=dummy
telegram.bot.secret=
telegram.bot.path=
telegram.bot.allowed_updates=callback_query,message
telegram.bot.token=
telegram.bot.username=

###############################
##### Max bot properties #####
###############################
max.bot.type=dummy
max.bot.long.pooling.cron.milliseconds=3
max.bot.long.pooling.timeout.seconds=1
max.bot.long.pooling.update-types=
max.bot.url=
max.bot.token=

###########################
### Database properties ###
###########################
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.schema-locations=classpath:db/db-test-drop.sql,classpath:db/db-test-init.sql,classpath:db/db-test-data.sql

############################
### KeepAlive properties ###
############################
db.keepalive.interval.seconds=5
db.keepalive.delay.coefficient=10

########################
### Lock properties ####
########################
db.lock.check.interval.millis=1000
db.lock.expire.after.created.seconds=86400
db.lock.max.waiting.threads.per.lock=3

########################
### Admin properties ###
########################
admin.secret=12345
max.clients.send.message.count=100

############################
### Scheduled properties ###
############################
global.sync.enabled=false
global.sync.cron.milliseconds=1500000
sync.card.types.enabled=true
sync.card.enabled=true
sync.adverts.enabled=true
delete.expired.subscriptions.cron=0 0 0 * * *
notify.clients.expired.subscription.cron=0 0 0 * * *
check.advert.cron.milliseconds=300000
check.advert.iterations.before.increase=6

#########################
### Custom properties ###
#########################
message.filers.list=BotExceptionFilter,ClientFilter,MDCFilter,ClientBlockedFilter,WhitelistFilter,UserBadMessageFilter
max.start.sum.difference=500
max.running.adverts.limit=6
advert.min.budget.sum=500
advert.min.cpm=700
advert.max.cpm=4000
advert.budget.sum.increase.value=1000
advert.cpm.increase.value=100
telegram.bot.support.url=https://t.me/+el9s5RjMAi4yMjZi
client.subscription.expires.days.after=30
client.subscription.notify.days.before=3
print.properties.enabled=false
print.properties.onlyAt.start=true
print.properties.cron=0/10 * * ? * *
hikari.pool.metrics.log.enabled=false
hikari.pool.metrics.log.cron.milliseconds=60000
amount.delimiters=.,,
qr.code.url=https://ya.ru/

########################
### Retry properties ###
########################
send.file.retry.attempts.count=3
send.file.retry.initial.delay.millis=500
send.file.retry.exponential.backoff.multiplier=1.5
send.file.retry.max.delay.millis=3000

#############################
### Validation properties ###
#############################
