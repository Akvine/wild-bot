photo.height.min.pixels=900
photo.max.size.megabytes=5

######################################
### Two factor security properties ###
######################################
security.two.factor.authentication.enabled=true
security.notification.provider.type=CONSTANT
security.notification.constant.dummy.code=4444
security.otp.length=4
security.otp.max.invalid.attempts=3
